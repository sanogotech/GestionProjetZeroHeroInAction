<style>
/* ===================== Design tokens ===================== */
:root {
  --navy-deep: #070f1e;
  --navy: #0d1f3c;
  --navy-soft: #142a4f;
  --navy-card: #112343;
  --gold: #cf9d34;
  --gold-bright: #e8bc54;
  --ice: #7fd0f0;
  --ice-soft: #9fdcf5;
  --ink: #eef2f8;
  --ink-muted: #9fb0c6;
  --ok: #59c98a;
  --ko: #e06868;
  --border: rgba(255, 255, 255, 0.09);
  --shadow: 0 18px 40px rgba(3, 8, 20, 0.45);
  --radius: 14px;
  --serif: "Fraunces", Georgia, "Times New Roman", serif;
  --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    /* This design is intentionally always dark (Midnight Executive identity) */
  }
}

* { box-sizing: border-box; }

html, body {
  background: radial-gradient(ellipse at top, var(--navy) 0%, var(--navy-deep) 65%);
  color: var(--ink);
  font-family: var(--sans);
  min-height: 100vh;
}

body {
  margin: 0;
  padding: 0 0 64px;
  -webkit-font-smoothing: antialiased;
}

.app-shell {
  max-width: 980px;
  margin: 0 auto;
  padding: 48px 20px 0;
}

/* subtle fixed backdrop texture */
.backdrop-grid {
  position: fixed;
  inset: 0;
  z-index: -1;
  background-image:
    radial-gradient(circle at 15% 10%, rgba(127, 208, 240, 0.07), transparent 45%),
    radial-gradient(circle at 85% 30%, rgba(207, 157, 52, 0.08), transparent 40%);
  pointer-events: none;
}

/* ===================== Intro hero ===================== */
.intro-hero {
  text-align: center;
  padding: 12px 8px 40px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 40px;
}

.hero-eyebrow {
  color: var(--ice-soft);
  font-size: 0.86rem;
  letter-spacing: 0.02em;
  margin-bottom: 18px;
  font-weight: 500;
}

.hero-title {
  font-family: var(--serif);
  font-weight: 600;
  font-size: clamp(2.2rem, 5vw, 3.4rem);
  line-height: 1.08;
  margin: 0 0 18px;
  color: var(--ink);
}

.hero-title-accent {
  color: var(--gold-bright);
  font-style: italic;
}

.hero-sub {
  color: var(--ink-muted);
  font-size: 1.05rem;
  margin: 0 auto 22px;
  max-width: 560px;
}

.hero-case {
  color: var(--ink-muted);
  font-size: 0.92rem;
  line-height: 1.65;
  max-width: 680px;
  margin: 0 auto 30px;
  padding: 18px 22px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  text-align: left;
}

.hero-actions { margin-top: 8px; }

/* ===================== Buttons ===================== */
.btn-gold {
  background: linear-gradient(135deg, var(--gold-bright), var(--gold));
  color: #1a1204;
  border: none;
  font-weight: 600;
  font-size: 1rem;
  padding: 13px 28px;
  border-radius: 999px;
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  box-shadow: 0 8px 22px rgba(207, 157, 52, 0.25);
}
.btn-gold:hover { transform: translateY(-1px); box-shadow: 0 12px 26px rgba(207, 157, 52, 0.35); }
.btn-gold:focus-visible { outline: 3px solid var(--ice); outline-offset: 2px; }

.btn-ghost {
  background: transparent;
  color: var(--ink-muted);
  border: 1px solid var(--border);
  font-weight: 500;
  font-size: 0.92rem;
  padding: 11px 22px;
  border-radius: 999px;
  cursor: pointer;
  transition: border-color 0.15s ease, color 0.15s ease;
}
.btn-ghost:hover { border-color: var(--ice); color: var(--ice-soft); }
.btn-ghost:focus-visible { outline: 3px solid var(--ice); outline-offset: 2px; }

/* ===================== Modules grid (intro) ===================== */
.section-label {
  font-family: var(--serif);
  font-size: 1.15rem;
  font-weight: 500;
  color: var(--ink);
  margin-bottom: 18px;
}

.modules-grid .row { --bs-gutter-x: 0.75rem; }
.col-lg-2-4 { flex: 0 0 auto; width: 20%; }
@media (max-width: 992px) { .col-lg-2-4 { width: 33.33%; } }
@media (max-width: 576px) { .col-lg-2-4 { width: 50%; } }

.mod-pill {
  width: 100%;
  background: var(--navy-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 14px;
  color: var(--ink);
  text-align: left;
  cursor: pointer;
  transition: border-color 0.15s ease, transform 0.15s ease;
  display: flex;
  flex-direction: column;
  gap: 6px;
  height: 100%;
}
.mod-pill:hover { border-color: var(--gold); transform: translateY(-2px); }
.mod-pill-icon { font-size: 1.4rem; }
.mod-pill-title { font-weight: 600; font-size: 0.92rem; line-height: 1.3; }
.mod-pill-count { color: var(--ink-muted); font-size: 0.78rem; }

/* ===================== Quiz shell ===================== */
.quiz-shell { padding-bottom: 30px; }

.modnav {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
  margin-bottom: 22px;
}
.modnav-dot {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--navy-card);
  border: 1px solid var(--border);
  color: var(--ink-muted);
  font-size: 1.05rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: border-color 0.15s ease, transform 0.15s ease;
}
.modnav-dot.is-active { border-color: var(--ice); transform: scale(1.08); }
.modnav-dot.is-done { border-color: var(--gold); }
.modnav-dot:hover { transform: scale(1.08); }

/* ===================== Progress ===================== */
.global-progress { margin-bottom: 26px; }
.global-progress-track {
  height: 8px;
  background: rgba(255, 255, 255, 0.06);
  border-radius: 999px;
  overflow: hidden;
}
.global-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--ice), var(--gold-bright));
  transition: width 0.3s ease;
}
.global-progress-label {
  text-align: center;
  color: var(--ink-muted);
  font-size: 0.82rem;
  margin-top: 8px;
}

/* ===================== Quiz card ===================== */
.quiz-card {
  background: var(--navy-card);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 32px;
  box-shadow: var(--shadow);
}

.quiz-card-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.quiz-mod-badge {
  color: var(--ice-soft);
  font-size: 0.85rem;
  font-weight: 600;
  background: rgba(127, 208, 240, 0.08);
  border: 1px solid rgba(127, 208, 240, 0.2);
  padding: 5px 14px;
  border-radius: 999px;
}

.quiz-q-count {
  color: var(--ink-muted);
  font-size: 0.85rem;
}

.quiz-question {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 1.5rem;
  line-height: 1.35;
  margin: 0 0 26px;
  color: var(--ink);
}

.opt-list { display: flex; flex-direction: column; gap: 10px; }

.opt-btn {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  text-align: left;
  background: rgba(255, 255, 255, 0.02);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px;
  color: var(--ink);
  font-size: 0.98rem;
  cursor: pointer;
  transition: border-color 0.15s ease, background 0.15s ease;
}
.opt-btn:not(:disabled):hover { border-color: var(--ice); background: rgba(127, 208, 240, 0.05); }
.opt-btn:focus-visible { outline: 3px solid var(--ice); outline-offset: 2px; }
.opt-btn:disabled { cursor: default; }

.opt-letter {
  flex: 0 0 auto;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.06);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--ink-muted);
}
.opt-text { flex: 1 1 auto; line-height: 1.4; }
.opt-icon { flex: 0 0 auto; font-size: 1.1rem; font-weight: 700; }

.opt-correct { border-color: var(--ok); background: rgba(89, 201, 138, 0.09); }
.opt-correct .opt-letter { background: var(--ok); color: #05170d; }
.opt-correct .opt-icon { color: var(--ok); }

.opt-wrong { border-color: var(--ko); background: rgba(224, 104, 104, 0.09); }
.opt-wrong .opt-letter { background: var(--ko); color: #200404; }
.opt-wrong .opt-icon { color: var(--ko); }

.opt-muted { opacity: 0.45; }

/* ===================== Feedback panel ===================== */
.feedback {
  margin-top: 24px;
  padding-top: 22px;
  border-top: 1px solid var(--border);
  animation: feedbackIn 0.35s ease;
}
@keyframes feedbackIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}
@media (prefers-reduced-motion: reduce) {
  .feedback { animation: none; }
}

.feedback-head {
  font-family: var(--serif);
  font-size: 1.1rem;
  font-weight: 600;
  margin-bottom: 16px;
}
.feedback-ok .feedback-head { color: var(--ok); }
.feedback-ko .feedback-head { color: var(--ko); }

.feedback-block { margin-bottom: 16px; }
.feedback-label {
  font-size: 0.8rem;
  font-weight: 700;
  letter-spacing: 0.01em;
  color: var(--gold-bright);
  margin-bottom: 5px;
}
.feedback-block p { margin: 0; color: var(--ink); line-height: 1.6; font-size: 0.95rem; }

.feedback-sagesse {
  background: rgba(207, 157, 52, 0.07);
  border: 1px solid rgba(207, 157, 52, 0.22);
  border-radius: 10px;
  padding: 14px 16px;
}
.feedback-sagesse p { font-style: italic; color: var(--ice-soft); }

.feedback-actions { margin-top: 22px; text-align: right; }

.quiz-footer-nav { text-align: center; margin-top: 24px; }

/* ===================== Module / final done screens ===================== */
.done-card, .final-card {
  background: var(--navy-card);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 44px 32px;
  text-align: center;
  box-shadow: var(--shadow);
}

.done-emoji, .final-emoji { font-size: 3rem; margin-bottom: 14px; }

.done-card h2, .final-card h2 {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 1.6rem;
  margin: 0 0 12px;
}

.done-score, .final-score { font-size: 1.15rem; color: var(--ink-muted); margin: 0 0 4px; }
.done-score strong, .final-score strong { color: var(--ice-soft); }

.done-badge, .final-badge {
  display: inline-block;
  color: var(--gold-bright);
  font-weight: 600;
  font-size: 0.95rem;
  margin: 6px 0 28px;
  padding: 6px 18px;
  border: 1px solid rgba(207, 157, 52, 0.3);
  border-radius: 999px;
  background: rgba(207, 157, 52, 0.06);
}

.done-actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  justify-content: center;
}

/* ===================== Final breakdown ===================== */
.final-breakdown {
  text-align: left;
  margin: 10px 0 30px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.final-row {
  display: grid;
  grid-template-columns: 24px 1fr 120px 48px;
  align-items: center;
  gap: 10px;
}
.final-row-icon { font-size: 1rem; text-align: center; }
.final-row-title { font-size: 0.88rem; color: var(--ink-muted); }
.final-row-bar {
  height: 6px;
  background: rgba(255, 255, 255, 0.06);
  border-radius: 999px;
  overflow: hidden;
}
.final-row-bar-fill { height: 100%; background: linear-gradient(90deg, var(--ice), var(--gold-bright)); }
.final-row-pct { font-size: 0.82rem; color: var(--ink-muted); text-align: right; }

.final-sagesse {
  font-family: var(--serif);
  font-style: italic;
  font-size: 1.05rem;
  color: var(--ice-soft);
  max-width: 520px;
  margin: 0 auto 30px;
  line-height: 1.6;
}

@media (max-width: 576px) {
  .quiz-card { padding: 22px; }
  .final-row { grid-template-columns: 20px 1fr 40px; }
  .final-row-bar { display: none; }
}

        "tip": "Interrogez-vous régulièrement, en tant que leader d'équipe projet, sur la proportion de votre temps consacrée à lever des obstacles pour votre équipe plutôt qu'à simplement contrôler son avancement : cette bascule de posture caractérise concrètement le leadership serviteur en pratique.",

  const root = document.getElementById("app-root");

  // ---------- Helpers ----------
  function qKey(mi, qi) {
    return "m" + mi + "-q" + qi;
  }

  function totalAnswered() {
    return Object.keys(state.answers).length;
  }

  function totalCorrect() {
    return Object.values(state.answers).filter((a) => a.correct).length;
  }

  function moduleScore(mi) {
    const mod = QUIZ_DATA[mi];
    let answered = 0,
      correct = 0;
    mod.questions.forEach((q, qi) => {
      const a = state.answers[qKey(mi, qi)];
      if (a) {
        answered++;
        if (a.correct) correct++;
      }
    });
    return { answered, correct, total: mod.questions.length };
  }

  function badgeFor(pct) {
    if (pct >= 90) return { label: "Héros de la Gestion de Projet", emoji: "🏆" };
    if (pct >= 75) return { label: "Compagnon Confirmé", emoji: "🥈" };
    if (pct >= 55) return { label: "Apprenti Sérieux", emoji: "🥉" };
    return { label: "Explorateur — Zéro", emoji: "🌱" };
  }

  function escapeHtml(s) {
    const d = document.createElement("div");
    d.innerText = s;
    return d.innerHTML;
  }

  // ---------- Renderers ----------
  function renderIntro() {
    const modsHtml = QUIZ_DATA.map(
      (m, i) => `
      <div class="col-6 col-md-4 col-lg-2-4">
        <button class="mod-pill" data-goto="${i}">
          <span class="mod-pill-icon">${m.icon}</span>
          <span class="mod-pill-title">${escapeHtml(m.title)}</span>
          <span class="mod-pill-count">${m.questions.length} questions</span>
        </button>
      </div>`
    ).join("");

    root.innerHTML = `
      <div class="intro-hero">
        <div class="hero-eyebrow">Cas fil rouge — ${escapeHtml(CASE_INTRO.entreprise)} · ${escapeHtml(CASE_INTRO.projet)}</div>
        <h1 class="hero-title">La Gestion de Projet<br><span class="hero-title-accent">de Zéro à Héros</span></h1>
        <p class="hero-sub">60 questions · mode Apprentissage · réponse détaillée, REX, tip &amp; sagesse à chaque question</p>
        <p class="hero-case">${escapeHtml(CASE_INTRO.pitch)}</p>
        <div class="hero-actions">
          <button id="start-btn" class="btn-gold">Commencer le parcours</button>
        </div>
      </div>
      <div class="modules-grid">
        <h2 class="section-label">10 modules — choisissez votre point d'entrée</h2>
        <div class="row g-3">${modsHtml}</div>
      </div>
    `;

    document.getElementById("start-btn").addEventListener("click", () => {
      state.moduleIndex = 0;
      state.questionIndex = 0;
      state.view = "quiz";
      render();
    });
    root.querySelectorAll("[data-goto]").forEach((btn) => {
      btn.addEventListener("click", () => {
        state.moduleIndex = parseInt(btn.dataset.goto, 10);
        state.questionIndex = 0;
        state.view = "quiz";
        render();
      });
    });
  }

  function renderProgressBar() {
    const pct = Math.round((totalAnswered() / TOTAL_QUESTIONS) * 100);
    return `
      <div class="global-progress">
        <div class="global-progress-track">
          <div class="global-progress-fill" style="width:${pct}%"></div>
        </div>
        <div class="global-progress-label">${totalAnswered()} / ${TOTAL_QUESTIONS} questions · ${totalCorrect()} bonnes réponses</div>
      </div>`;
  }

  function renderModuleNav() {
    return QUIZ_DATA.map((m, i) => {
      const s = moduleScore(i);
      const done = s.answered === s.total;
      const active = i === state.moduleIndex;
      return `<button class="modnav-dot ${active ? "is-active" : ""} ${done ? "is-done" : ""}"
                data-nav="${i}" title="${escapeHtml(m.title)}">
                <span>${m.icon}</span>
              </button>`;
    }).join("");
  }

  function renderQuiz() {
    const mod = QUIZ_DATA[state.moduleIndex];
    const qi = state.questionIndex;
    const q = mod.questions[qi];
    const key = qKey(state.moduleIndex, qi);
    const already = state.answers[key];

    const optionsHtml = q.options
      .map((opt, oi) => {
        let cls = "opt-btn";
        let icon = "";
        if (already) {
          if (oi === q.correct) {
            cls += " opt-correct";
            icon = "✓";
          } else if (oi === already.chosen) {
            cls += " opt-wrong";
            icon = "✕";
          } else {
            cls += " opt-muted";
          }
        }
        return `<button class="${cls}" data-opt="${oi}" ${already ? "disabled" : ""}>
                  <span class="opt-letter">${String.fromCharCode(65 + oi)}</span>
                  <span class="opt-text">${escapeHtml(opt)}</span>
                  <span class="opt-icon">${icon}</span>
                </button>`;
      })
      .join("");

    const feedbackHtml = already
      ? `
      <div class="feedback ${already.correct ? "feedback-ok" : "feedback-ko"}">
        <div class="feedback-head">
          ${already.correct ? "✅ Exact." : "❌ Pas tout à fait."}
        </div>
        <div class="feedback-block">
          <div class="feedback-label">📖 Réponse détaillée</div>
          <p>${escapeHtml(q.explication)}</p>
        </div>
        <div class="feedback-block">
          <div class="feedback-label">🏢 REX — ${escapeHtml(CASE_INTRO.projet)}</div>
          <p>${escapeHtml(q.rex)}</p>
        </div>
        <div class="feedback-block">
          <div class="feedback-label">💡 Tip</div>
          <p>${escapeHtml(q.tip)}</p>
        </div>
        <div class="feedback-block feedback-sagesse">
          <div class="feedback-label">🕊️ Sagesse</div>
          <p>« ${escapeHtml(q.sagesse)} »</p>
        </div>
        <div class="feedback-actions">
          <button id="next-btn" class="btn-gold">${
            qi === mod.questions.length - 1 ? "Voir le bilan du module →" : "Question suivante →"
          }</button>
        </div>
      </div>`
      : "";

    root.innerHTML = `
      <div class="quiz-shell">
        <div class="modnav">${renderModuleNav()}</div>
        ${renderProgressBar()}
        <div class="quiz-card">
          <div class="quiz-card-head">
            <span class="quiz-mod-badge">${mod.icon} ${escapeHtml(mod.title)}</span>
            <span class="quiz-q-count">Question ${qi + 1} / ${mod.questions.length}</span>
          </div>
          <h3 class="quiz-question">${escapeHtml(q.q)}</h3>
          <div class="opt-list">${optionsHtml}</div>
          ${feedbackHtml}
        </div>
        <div class="quiz-footer-nav">
          <button id="back-intro" class="btn-ghost">← Sommaire des modules</button>
        </div>
      </div>
    `;

    root.querySelectorAll(".opt-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        if (state.answers[key]) return;
        const chosen = parseInt(btn.dataset.opt, 10);
        state.answers[key] = { chosen, correct: chosen === q.correct };
        render();
      });
    });

    const nextBtn = document.getElementById("next-btn");
    if (nextBtn) {
      nextBtn.addEventListener("click", () => {
        if (qi < mod.questions.length - 1) {
          state.questionIndex++;
        } else {
          state.view = "moduleDone";
        }
        render();
      });
    }

    document.getElementById("back-intro").addEventListener("click", () => {
      state.view = "intro";
      render();
    });

    root.querySelectorAll("[data-nav]").forEach((btn) => {
      btn.addEventListener("click", () => {
        state.moduleIndex = parseInt(btn.dataset.nav, 10);
        state.questionIndex = 0;
        render();
      });
    });
  }

  function renderModuleDone() {
    const mi = state.moduleIndex;
    const mod = QUIZ_DATA[mi];
    const s = moduleScore(mi);
    const pct = Math.round((s.correct / s.total) * 100);
    const badge = badgeFor(pct);
    const hasNext = mi < QUIZ_DATA.length - 1;

    root.innerHTML = `
      <div class="quiz-shell">
        ${renderProgressBar()}
        <div class="done-card">
          <div class="done-emoji">${badge.emoji}</div>
          <h2>Module terminé : ${escapeHtml(mod.title)}</h2>
          <p class="done-score">${s.correct} / ${s.total} bonnes réponses — <strong>${pct}%</strong></p>
          <p class="done-badge">${badge.label}</p>
          <div class="done-actions">
            ${hasNext ? `<button id="next-mod" class="btn-gold">Module suivant : ${escapeHtml(QUIZ_DATA[mi + 1].title)} →</button>` : ""}
            <button id="review-mod" class="btn-ghost">Revoir ce module</button>
            <button id="all-mods" class="btn-ghost">Sommaire des modules</button>
            ${!hasNext ? `<button id="final-bilan" class="btn-gold">Voir le bilan final 🏆</button>` : ""}
          </div>
        </div>
      </div>
    `;

    if (hasNext) {
      document.getElementById("next-mod").addEventListener("click", () => {
        state.moduleIndex++;
        state.questionIndex = 0;
        state.view = "quiz";
        render();
      });
    }
    document.getElementById("review-mod").addEventListener("click", () => {
      state.questionIndex = 0;
      state.view = "quiz";
      render();
    });
    document.getElementById("all-mods").addEventListener("click", () => {
      state.view = "intro";
      render();
    });
    const finalBtn = document.getElementById("final-bilan");
    if (finalBtn) {
      finalBtn.addEventListener("click", () => {
        state.view = "finalDone";
        render();
      });
    }
  }

  function renderFinalDone() {
    const correct = totalCorrect();
    const pct = Math.round((correct / TOTAL_QUESTIONS) * 100);
    const badge = badgeFor(pct);

    const perModule = QUIZ_DATA.map((m, i) => {
      const s = moduleScore(i);
      const p = s.total ? Math.round((s.correct / s.total) * 100) : 0;
      return `
        <div class="final-row">
          <span class="final-row-icon">${m.icon}</span>
          <span class="final-row-title">${escapeHtml(m.title)}</span>
          <div class="final-row-bar"><div class="final-row-bar-fill" style="width:${p}%"></div></div>
          <span class="final-row-pct">${s.correct}/${s.total}</span>
        </div>`;
    }).join("");

    root.innerHTML = `
      <div class="quiz-shell">
        <div class="final-card">
          <div class="final-emoji">${badge.emoji}</div>
          <h2>Bilan final — ${escapeHtml(CASE_INTRO.projet)}</h2>
          <p class="final-score">${correct} / ${TOTAL_QUESTIONS} bonnes réponses — <strong>${pct}%</strong></p>
          <p class="final-badge">${badge.label}</p>
          <div class="final-breakdown">${perModule}</div>
          <p class="final-sagesse">« On ne devient pas un héros de la gestion de projet en évitant toutes les tempêtes, mais en apprenant à les traverser avec méthode. »</p>
          <div class="done-actions">
            <button id="restart-btn" class="btn-gold">Recommencer le parcours</button>
            <button id="back-mods-final" class="btn-ghost">Sommaire des modules</button>
          </div>
        </div>
      </div>
    `;

    document.getElementById("restart-btn").addEventListener("click", () => {
      state.answers = {};
      state.moduleIndex = 0;
      state.questionIndex = 0;
      state.view = "intro";
      render();
    });
    document.getElementById("back-mods-final").addEventListener("click", () => {
      state.view = "intro";
      render();
    });
  }

  function render() {
    window.scrollTo({ top: 0, behavior: "smooth" });
    if (state.view === "intro") renderIntro();
    else if (state.view === "quiz") renderQuiz();
    else if (state.view === "moduleDone") renderModuleDone();
    else if (state.view === "finalDone") renderFinalDone();
  }

  render();
})();

</script>
</body>
</html>
